<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <title>Checkout | Creative Detour</title>

  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>

<header class="site-header">
  <div class="container">
    <a href="./index.html" class="brand-mark">
      Creative Detour
    </a>
  </div>
</header>

<main class="section">

  <div class="container">

    <div class="checkout-page">

      <h1 id="checkoutTitle"></h1>

<div class="checkout-card">

  <div id="checkoutSummary"></div>

  <form
    id="checkoutForm"
    class="checkout-form">

    <input
      type="text"
      id="customerName"
      placeholder="Full Name"
      required>

    <input
      type="tel"
      id="customerPhone"
      placeholder="Phone Number"
      required>
    <input
  type="email"
  id="customerEmail"
  placeholder="Email Address"
  required>
    
    <textarea
      id="customerAddress"
      placeholder="Full Address"
      required></textarea>

    <input
      type="text"
      id="customerPincode"
      placeholder="Pincode"
      required>

    <div class="payment-options">

  <div class="payment-card">

    <h3>💳 Full Prepaid</h3>

    <p class="payment-price">
      ₹<span id="prepaidAmount"></span>
    </p>

    <button
      type="button"
      id="prepaidButton">
      Continue
    </button>

  </div>

  <div class="payment-card">

    <h3>📦 Partial COD</h3>

    <p>
      Pay ₹<span id="codAdvance"></span> now
    </p>

    <p>
      ₹<span id="codRemaining"></span> on delivery
    </p>

    <button
      type="button"
      id="codButton">
      Continue
    </button>

  </div>

</div>

  </form>

</div>

  </div>

</main>
<div id="paymentLoading" class="payment-loading">

  <div class="payment-loading-card">

    <div class="loader"></div>

    <h2>Preparing Secure Payment...</h2>

    <p>
      Please wait while we connect to Razorpay.
    </p>

  </div>

</div>
<script type="module" src="./assets/js/checkout.js"></script>

</body>
</html>
