<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creative Detour</title>

  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>

<header class="site-header">
  <div class="container">
    <a href="./index.html" class="brand-mark">
      Creative Detour
    </a>
  </div>
</header>

<main class="section">

  <div class="container">

    <div class="product-detail">

      <div class="product-detail__media">
        <img id="productImage" alt="">
      </div>

      <div class="product-detail__content">

        <p class="eyebrow">Creative Detour</p>

        <h1 id="productTitle"></h1>

        <div class="product-price" id="productPrice"></div>

        <p
  class="product-description"
  id="productDescription">
</p>
<div class="product-extra">

  <div class="product-info-block">
    <span class="product-info-label">
      Sizes Available
    </span>

    <div id="productSizes"></div>
  </div>

  <div class="product-info-block">
    <span class="product-info-label">
      Colors Available
    </span>

    <div id="productColors"></div>
  </div>

  <a
    id="sizeChartLink"
    class="size-chart-link"
    target="_blank"
    rel="noopener noreferrer">

    📏 View Size Guide

  </a>

</div>
        <div id="prepaidContainer"></div>

        <div id="codContainer"></div>

      </div>

    </div>

  </div>

</main>

<script type="module" src="./assets/js/product.js"></script>

</body>
</html>
